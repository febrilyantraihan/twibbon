<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <mask id="center-cutout-nasional">
      <rect width="1080" height="1080" fill="#ffffff"/>
      <circle cx="540" cy="490" r="375" fill="#000000"/>
    </mask>
    <linearGradient id="grad-red-nasional" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="grad-gold-nasional" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Base Decorative Background Layer with Center Hole -->
  <g mask="url(#center-cutout-nasional)">
    <!-- Deep Green Background -->
    <rect width="1080" height="1080" fill="#0c4a28"/>

    <!-- Red & White Diagonal Decorative Stripes (National Pride) -->
    <path d="M0,0 L420,0 L0,420 Z" fill="url(#grad-red-nasional)"/>
    <path d="M0,420 L420,0 L470,0 L0,470 Z" fill="#ffffff"/>

    <path d="M1080,0 L660,0 L1080,420 Z" fill="url(#grad-red-nasional)"/>
    <path d="M1080,420 L660,0 L610,0 L1080,470 Z" fill="#ffffff"/>

    <!-- Gold Laurel Wreath Rings -->
    <circle cx="540" cy="490" r="460" fill="none" stroke="url(#grad-gold-nasional)" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- Photo Ring Border -->
  <circle cx="540" cy="490" r="380" fill="none" stroke="#ffffff" stroke-width="12"/>
  <circle cx="540" cy="490" r="388" fill="none" stroke="url(#grad-gold-nasional)" stroke-width="4"/>

  <!-- Top Ribbon Banner: HARI SANTRI 22 OKTOBER -->
  <g transform="translate(540, 78)">
    <rect x="-220" y="-30" width="440" height="56" rx="28" fill="url(#grad-red-nasional)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.25))"/>
    <text x="0" y="7" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" letter-spacing="1.5" text-anchor="middle">22 OKTOBER 2026</text>
  </g>

  <!-- Bottom Ribbons & Campaign Headline -->
  <g transform="translate(540, 930)">
    <!-- Base Dark Ribbon -->
    <path d="M-470,-35 L470,-35 L440,40 L-440,40 Z" fill="#062b17"/>
    <!-- Main Green-Gold Card -->
    <rect x="-440" y="-45" width="880" height="76" rx="12" fill="#15803d" stroke="url(#grad-gold-nasional)" stroke-width="4" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.35))"/>
    <text x="0" y="3" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" letter-spacing="0.5" text-anchor="middle">HARI SANTRI NASIONAL 2026</text>
    
    <!-- Sub-label -->
    <rect x="-240" y="38" width="480" height="38" rx="8" fill="url(#grad-gold-nasional)"/>
    <text x="0" y="63" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">JIHAD SANTRI JAYAKAN NEGERI</text>
  </g>
</svg>
