<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <mask id="center-cutout-sains">
      <rect width="1080" height="1080" fill="#ffffff"/>
      <circle cx="540" cy="490" r="375" fill="#000000"/>
    </mask>
    <linearGradient id="grad-blue-sains" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="grad-cyan-sains" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad-gold-sains" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Base Decorative Background Layer with Center Hole -->
  <g mask="url(#center-cutout-sains)">
    <rect width="1080" height="1080" fill="url(#grad-blue-sains)"/>

    <!-- High-Tech Geometric Orbits -->
    <ellipse cx="540" cy="490" rx="460" ry="240" fill="none" stroke="url(#grad-cyan-sains)" stroke-width="3" transform="rotate(-30, 540, 490)" opacity="0.6"/>
    <ellipse cx="540" cy="490" rx="460" ry="240" fill="none" stroke="url(#grad-cyan-sains)" stroke-width="3" transform="rotate(30, 540, 490)" opacity="0.6"/>
    <ellipse cx="540" cy="490" rx="460" ry="240" fill="none" stroke="url(#grad-gold-sains)" stroke-width="3" transform="rotate(90, 540, 490)" opacity="0.4"/>

    <!-- Subtle Tech Dots -->
    <circle cx="540" cy="490" r="460" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10,14" opacity="0.5"/>
  </g>

  <!-- Photo Ring Border -->
  <circle cx="540" cy="490" r="380" fill="none" stroke="url(#grad-cyan-sains)" stroke-width="12"/>
  <circle cx="540" cy="490" r="388" fill="none" stroke="url(#grad-gold-sains)" stroke-width="4"/>

  <!-- Top Badge: KEMPETISI TINGKAT NASIONAL -->
  <g transform="translate(540, 80)">
    <rect x="-210" y="-30" width="420" height="54" rx="27" fill="#0284c7" stroke="url(#grad-gold-sains)" stroke-width="2.5" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.3))"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="1" text-anchor="middle">KOMPETISI SAINS NASIONAL</text>
  </g>

  <!-- Bottom Ribbons & Campaign Headline -->
  <g transform="translate(540, 930)">
    <rect x="-440" y="-45" width="880" height="76" rx="12" fill="#0f172a" stroke="url(#grad-cyan-sains)" stroke-width="3.5" filter="drop-shadow(0 8px 25px rgba(0,0,0,0.45))"/>
    <text x="0" y="3" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="33" font-weight="900" letter-spacing="0.5" text-anchor="middle">OLIMPIADE SAINS NUSANTARA 2026</text>
    
    <!-- Sub-label -->
    <rect x="-230" y="38" width="460" height="38" rx="8" fill="url(#grad-gold-sains)"/>
    <text x="0" y="63" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">GENERASI CERDAS BERPRESTASI</text>
  </g>
</svg>
