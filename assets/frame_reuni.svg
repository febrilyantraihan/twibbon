<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <mask id="center-cutout-reuni">
      <rect width="1080" height="1080" fill="#ffffff"/>
      <circle cx="540" cy="490" r="375" fill="#000000"/>
    </mask>
    <linearGradient id="grad-navy-reuni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#112d26"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="grad-gold-reuni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Base Decorative Background Layer with Center Hole -->
  <g mask="url(#center-cutout-reuni)">
    <rect width="1080" height="1080" fill="url(#grad-navy-reuni)"/>

    <!-- Confetti & Celebration Sparkles -->
    <polygon points="120,100 130,120 150,130 130,140 120,160 110,140 90,130 110,120" fill="url(#grad-gold-reuni)"/>
    <polygon points="960,120 970,140 990,150 970,160 960,180 950,160 930,150 950,140" fill="url(#grad-gold-reuni)"/>
    <polygon points="140,840 150,860 170,870 150,880 140,900 130,880 110,870 130,860" fill="url(#grad-gold-reuni)"/>
    <polygon points="940,860 950,880 970,890 950,900 940,920 930,900 910,890 930,880" fill="url(#grad-gold-reuni)"/>

    <circle cx="200" cy="240" r="10" fill="#facc15" opacity="0.6"/>
    <circle cx="880" cy="220" r="14" fill="#facc15" opacity="0.6"/>
    <circle cx="180" cy="740" r="12" fill="#34d399" opacity="0.5"/>
    <circle cx="900" cy="760" r="10" fill="#34d399" opacity="0.5"/>

    <circle cx="540" cy="490" r="460" fill="none" stroke="url(#grad-gold-reuni)" stroke-width="4" opacity="0.4"/>
  </g>

  <!-- Photo Ring Border -->
  <circle cx="540" cy="490" r="380" fill="none" stroke="url(#grad-gold-reuni)" stroke-width="12"/>
  <circle cx="540" cy="490" r="390" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>

  <!-- Top Badge: IKATAN KELUARGA ALUMNI -->
  <g transform="translate(540, 80)">
    <rect x="-210" y="-30" width="420" height="54" rx="27" fill="#047857" stroke="url(#grad-gold-reuni)" stroke-width="2.5" filter="drop-shadow(0 4px 14px rgba(0,0,0,0.3))"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="1" text-anchor="middle">IKATAN KELUARGA ALUMNI</text>
  </g>

  <!-- Bottom Ribbons & Campaign Headline -->
  <g transform="translate(540, 930)">
    <rect x="-440" y="-45" width="880" height="76" rx="12" fill="#064e3b" stroke="url(#grad-gold-reuni)" stroke-width="3.5" filter="drop-shadow(0 8px 25px rgba(0,0,0,0.45))"/>
    <text x="0" y="3" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="33" font-weight="900" letter-spacing="0.5" text-anchor="middle">REUNI AKBAR &amp; TEMU ALUMNI 2026</text>
    
    <!-- Sub-label -->
    <rect x="-250" y="38" width="500" height="38" rx="8" fill="url(#grad-gold-reuni)"/>
    <text x="0" y="63" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">MERAJUT SILATURAHMI, BERBAGI INSPIRASI</text>
  </g>
</svg>
